<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödev Takip Sistemi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #0f1923; --ink-soft: #3a4a5a; --ink-muted: #8a9ab0;
      --paper: #f5f2ec; --paper-warm: #ede9e0; --line: #d8d2c8;
      --accent-admin: #c0392b; --accent-teacher: #1a5276; --accent-student: #1e8449;
      --accent-admin-bg: #fdf2f0; --accent-teacher-bg: #eaf1f8; --accent-student-bg: #eafaf1;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.35; pointer-events: none; }
    body::after { content: ''; position: fixed; top: -120px; right: -120px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(192,57,43,0.08) 0%, transparent 70%); pointer-events: none; }
    .page { position: relative; z-index: 1; width: 100%; max-width: 440px; animation: pageIn 0.6s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes pageIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1.5px solid var(--line); }
    .header-icon { width: 48px; height: 48px; flex-shrink: 0; }
    @media (max-width: 380px) { .header-icon { width: 40px; height: 40px; } }
    .header-text h1 { font-family: 'DM Serif Display', serif; font-size: clamp(18px, 5vw, 22px); color: var(--ink); line-height: 1.2; letter-spacing: -0.3px; }
    .header-text p { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card { display: flex; align-items: center; gap: 16px; padding: 16px 18px; background: white; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; text-decoration: none; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    .card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.18s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,25,35,0.10); }
    .card:active { transform: scale(0.98); }
    .card-admin::before { background: var(--accent-admin-bg); }
    .card-teacher::before { background: var(--accent-teacher-bg); }
    .card-student::before { background: var(--accent-student-bg); }
    .card:hover::before { opacity: 1; }
    .card-admin:hover { border-color: rgba(192,57,43,0.35); }
    .card-teacher:hover { border-color: rgba(26,82,118,0.35); }
    .card-student:hover { border-color: rgba(30,132,73,0.35); }
    .card-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; transition: background 0.18s; }
    .card-admin .card-icon { background: var(--accent-admin-bg); }
    .card-teacher .card-icon { background: var(--accent-teacher-bg); }
    .card-student .card-icon { background: var(--accent-student-bg); }
    .card-admin:hover .card-icon { background: var(--accent-admin); }
    .card-teacher:hover .card-icon { background: var(--accent-teacher); }
    .card-student:hover .card-icon { background: var(--accent-student); }
    .card-icon svg { transition: color 0.18s ease; }
    .card-admin .card-icon svg { color: var(--accent-admin); }
    .card-teacher .card-icon svg { color: var(--accent-teacher); }
    .card-student .card-icon svg { color: var(--accent-student); }
    .card-admin:hover .card-icon svg, .card-teacher:hover .card-icon svg, .card-student:hover .card-icon svg { color: white; }
    .card-body { flex: 1; position: relative; z-index: 1; min-width: 0; }
    .card-body h3 { font-size: clamp(13px, 3.5vw, 14.5px); font-weight: 600; color: var(--ink); }
    .card-body p { font-size: clamp(11px, 3vw, 12.5px); color: var(--ink-muted); margin-top: 2px; }
    .card-arrow { position: relative; z-index: 1; color: var(--ink-muted); transition: transform 0.18s ease, color 0.18s ease; flex-shrink: 0; }
    .card:hover .card-arrow { transform: translateX(3px); color: var(--ink-soft); }
    .footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .footer-left { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #27ae60; animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.55;transform:scale(.85);} }
    .footer-left span, .footer-right { font-size: 11.5px; color: var(--ink-muted); }
    .card:nth-child(1) { animation: cardIn 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both; }
    .card:nth-child(2) { animation: cardIn 0.5s 0.22s cubic-bezier(0.22,1,0.36,1) both; }
    .card:nth-child(3) { animation: cardIn 0.5s 0.29s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes cardIn { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <svg class="header-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="52" height="52" rx="13" fill="#0f1923"/>
      <path d="M10 14C10 14 16 13 22 15.5V38C22 38 16 36 10 37V14Z" fill="white" fill-opacity="0.12"/>
      <path d="M10 14C10 14 16 13 22 15.5V38C22 38 16 36 10 37V14Z" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
      <path d="M42 14C42 14 36 13 30 15.5V38C30 38 36 36 42 37V14Z" fill="white" fill-opacity="0.12"/>
      <path d="M42 14C42 14 36 13 30 15.5V38C30 38 36 36 42 37V14Z" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="26" y1="15" x2="26" y2="38" stroke="white" stroke-opacity="0.7" stroke-width="1.5"/>
      <line x1="13" y1="20" x2="20" y2="20" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="13" y1="24" x2="20" y2="24" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="13" y1="28" x2="18" y2="28" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="32" y1="20" x2="39" y2="20" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="32" y1="24" x2="39" y2="24" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="32" y1="28" x2="37" y2="28" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
      <path d="M37 8V20L34.5 17.5L32 20V8H37Z" fill="#c0392b"/>
    </svg>
    <div class="header-text">
      <h1>Ödev Takip Sistemi</h1>
      <p>Giriş türünüzü seçerek devam edin</p>
    </div>
  </div>
  <div class="cards">
    <a class="card card-admin" href="admin.html">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M4 20c0-4 3.6-7 8-7"/><path d="M17 17l1.5 1.5L21 16"/><circle cx="18.5" cy="18.5" r="3.5"/></svg>
      </div>
      <div class="card-body"><h3>Admin Girişi</h3><p>Öğrenci, test ve içerik yönetimi</p></div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <a class="card card-teacher" href="ogretmen.html">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 8h4M7 11h6"/></svg>
      </div>
      <div class="card-body"><h3>Öğretmen Girişi</h3><p>Sınıf raporları ve başarı analizi</p></div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <a class="card card-student" href="ogrenci.html">
      <div class="card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="card-body"><h3>Öğrenci Girişi</h3><p>Test çöz, anlık sonucunu gör</p></div>
      <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>
  <div class="footer">
    <div class="footer-left"><div class="status-dot"></div><span>Sistem aktif</span></div>
    <span class="footer-right">2025 — 2026</span>
  </div>
</div>
</body>
</html>
