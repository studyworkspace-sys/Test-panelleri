<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #0f1923; --ink-soft: #3a4a5a; --ink-muted: #8a9ab0;
      --paper: #f5f2ec; --line: #d8d2c8; --white: #ffffff;
      --blue: #2563eb; --blue-dark: #1d4ed8; --blue-light: #eff6ff;
      --green: #16a34a; --green-light: #f0fdf4;
      --red: #dc2626; --red-light: #fef2f2;
      --orange: #ea580c; --purple: #7c3aed; --purple-light: #faf5ff;
      --radius: 14px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); min-height: 100vh; position: relative; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.3; pointer-events: none; z-index: 0; }

    /* HEADER */
    .header { background: var(--ink); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--blue); }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .header-logo { width: 32px; height: 32px; flex-shrink: 0; }
    .header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(13px, 3.5vw, 17px); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-badge { font-size: 11px; background: rgba(255,255,255,0.12); padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; display: none; }
    .header-badge.show { display: block; }
    .btn-cikis { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 12px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; transition: background 0.2s; font-family: 'DM Sans', sans-serif; }
    .btn-cikis:hover { background: rgba(255,255,255,0.18); }

    /* LOGIN */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; z-index: 1; width: 100%; }
    .login-box { background: var(--white); border: 1.5px solid var(--line); border-radius: 20px; padding: clamp(28px, 6vw, 44px); width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(15,25,35,0.08), 0 4px 16px rgba(15,25,35,0.04); }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .login-brand svg { width: 40px; height: 40px; }
    .login-brand-text h2 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; color: var(--ink); }
    .login-brand-text p { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 13px; margin-bottom: 7px; font-weight: 500; }
    .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font-size: 15px; outline: none; font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--white); transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    .form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn-primary { background: var(--ink); color: white; width: 100%; padding: 13px; font-size: 15px; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; margin-top: 8px; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
    .btn-primary:hover { background: var(--ink-soft); }
    .btn-primary:active { transform: scale(0.98); }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* PANEL */
    .panel { padding: clamp(14px, 4vw, 28px); max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

    /* CARD */
    .card { background: var(--white); border: 1.5px solid var(--line); border-radius: var(--radius); padding: clamp(16px, 4vw, 26px); margin-bottom: 16px; box-shadow: 0 2px 12px rgba(15,25,35,0.05); }
    .card-title { font-family: 'DM Serif Display', serif; font-size: clamp(16px, 4vw, 20px); font-weight: 400; color: var(--ink); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
    .card-title svg { color: var(--blue); }

    /* BACK BTN */
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1.5px solid var(--line); color: var(--ink-soft); cursor: pointer; font-size: 13px; font-weight: 500; margin-bottom: 16px; padding: 7px 14px; border-radius: 20px; transition: all 0.18s; font-family: 'DM Sans', sans-serif; }
    .back-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--paper); }

    /* DERS GRİD */
    .ders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 10px; }
    .ders-btn { padding: 20px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--white); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); transition: all 0.18s; text-align: center; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 10px; -webkit-tap-highlight-color: transparent; }
    .ders-btn:hover { border-color: var(--blue); background: var(--blue-light); color: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.1); }
    .ders-btn:active { transform: scale(0.97); }
    .ders-btn svg { color: var(--blue); }

    /* TEST LİSTESİ */
    .test-list { display: flex; flex-direction: column; gap: 8px; }
    .test-item { padding: 14px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--white); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.18s; -webkit-tap-highlight-color: transparent; }
    .test-item:hover { border-color: var(--blue); background: var(--blue-light); transform: translateX(4px); }
    .test-item:active { transform: scale(0.98); }
    .test-item-sol strong { font-size: 14px; color: var(--ink); display: block; font-weight: 600; }
    .test-item-sol span { font-size: 12px; color: var(--ink-muted); margin-top: 3px; display: block; }
    .test-item-arrow { color: var(--blue); flex-shrink: 0; }

    /* OPTİK FORM */
    .progress-wrap { margin-bottom: 20px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-muted); margin-bottom: 8px; }
    .progress-meta strong { color: var(--ink); }
    .progress-track { background: var(--line); border-radius: 10px; height: 6px; }
    .progress-fill { background: var(--blue); border-radius: 10px; height: 6px; transition: width 0.3s ease; }
    .optik-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .optik-inner { min-width: 280px; }
    .optik-head { display: grid; grid-template-columns: 42px 1fr 1fr 1fr 1fr; padding: 0 6px; margin-bottom: 6px; }
    .optik-head span { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.05em; }
    .optik-head span:first-child { text-align: left; }
    .optik-row { display: grid; grid-template-columns: 42px 1fr 1fr 1fr 1fr; align-items: center; padding: 3px 6px; border-radius: 8px; }
    .optik-row:nth-child(even) { background: var(--paper); }
    .optik-no { font-size: 13px; font-weight: 700; color: var(--ink-muted); }
    .optik-cell { display: flex; justify-content: center; padding: 3px; }
    .optik-balon { width: clamp(34px, 9vw, 40px); height: clamp(34px, 9vw, 40px); border-radius: 50%; border: 2px solid var(--line); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 3vw, 14px); font-weight: 700; color: var(--ink-muted); transition: all 0.15s; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .optik-balon:hover { border-color: var(--ink); color: var(--ink); }
    .optik-balon:active { transform: scale(0.88); }
    .optik-balon.secili-A { background: var(--blue); border-color: var(--blue); color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.35); }
    .optik-balon.secili-B { background: var(--green); border-color: var(--green); color: white; box-shadow: 0 2px 8px rgba(22,163,74,0.35); }
    .optik-balon.secili-C { background: var(--orange); border-color: var(--orange); color: white; box-shadow: 0 2px 8px rgba(234,88,12,0.35); }
    .optik-balon.secili-D { background: var(--purple); border-color: var(--purple); color: white; box-shadow: 0 2px 8px rgba(124,58,237,0.35); }
    .gonder-wrap { display: flex; justify-content: center; margin-top: 28px; }
    .btn-gonder { background: var(--green); color: white; padding: 14px 36px; font-size: 15px; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .btn-gonder:not(:disabled):hover { background: #15803d; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(22,163,74,0.3); }
    .btn-gonder:disabled { opacity: 0.35; cursor: not-allowed; }

    /* RAPOR */
    .rapor-ozet { display: grid; grid-template-columns: repeat(4,1fr); gap: clamp(8px,2vw,12px); margin-bottom: 24px; }
    @media (max-width:360px) { .rapor-ozet { grid-template-columns: repeat(2,1fr); } }
    .ozet-kart { padding: clamp(12px,3vw,18px); border-radius: var(--radius-sm); text-align: center; border: 1.5px solid transparent; }
    .ozet-kart.dogru { background: var(--green-light); border-color: #bbf7d0; }
    .ozet-kart.yanlis { background: var(--red-light); border-color: #fecaca; }
    .ozet-kart.net { background: var(--blue-light); border-color: #bfdbfe; }
    .ozet-kart.basari { background: var(--purple-light); border-color: #ede9fe; }
    .ozet-sayi { font-family: 'DM Serif Display', serif; font-size: clamp(22px,6vw,30px); font-weight: 400; }
    .ozet-kart.dogru .ozet-sayi { color: var(--green); }
    .ozet-kart.yanlis .ozet-sayi { color: var(--red); }
    .ozet-kart.net .ozet-sayi { color: var(--blue); }
    .ozet-kart.basari .ozet-sayi { color: var(--purple); }
    .ozet-label { font-size: clamp(10px,2.5vw,12px); margin-top: 4px; font-weight: 500; color: var(--ink-muted); }
    .rapor-tablo-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .rapor-tablo { width: 100%; border-collapse: collapse; min-width: 380px; }
    .rapor-tablo th { background: var(--paper); padding: 10px 12px; text-align: left; font-size: 12px; color: var(--ink-muted); border-bottom: 2px solid var(--line); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .rapor-tablo td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--paper); }
    .dogru-satir td { background: #f0fdf4; }
    .yanlis-satir td { background: #fff1f2; }
    .dogru-tag { color: var(--green); font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .yanlis-tag { color: var(--red); font-weight: 700; display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

<div id="loginSection">
  <div class="login-container">
    <div class="login-box">
      <div class="login-brand">
        <svg width="40" height="40" viewBox="0 0 52 52" fill="none">
          <rect width="52" height="52" rx="13" fill="#0f1923"/>
          <path d="M10 14C10 14 16 13 22 15.5V38C22 38 16 36 10 37V14Z" fill="white" fill-opacity="0.12"/>
          <path d="M10 14C10 14 16 13 22 15.5V38C22 38 16 36 10 37V14Z" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
          <path d="M42 14C42 14 36 13 30 15.5V38C30 38 36 36 42 37V14Z" fill="white" fill-opacity="0.12"/>
          <path d="M42 14C42 14 36 13 30 15.5V38C30 38 36 36 42 37V14Z" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
          <line x1="26" y1="15" x2="26" y2="38" stroke="white" stroke-opacity="0.7" stroke-width="1.5"/>
          <line x1="13" y1="20" x2="20" y2="20" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <line x1="13" y1="24" x2="20" y2="24" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <line x1="13" y1="28" x2="18" y2="28" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <line x1="32" y1="20" x2="39" y2="20" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <line x1="32" y1="24" x2="39" y2="24" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <line x1="32" y1="28" x2="37" y2="28" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <path d="M37 8V20L34.5 17.5L32 20V8H37Z" fill="#2563eb"/>
        </svg>
        <div class="login-brand-text">
          <h2>Öğrenci Girişi</h2>
          <p>Ödev Takip Sistemi</p>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Kullanıcı Adı
        </label>
        <input class="form-input" type="text" id="ogrKullanici" placeholder="Kullanıcı adınız" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Şifre
        </label>
        <input class="form-input" type="password" id="ogrSifre" placeholder="••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="girisBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Giriş Yap
      </button>
      <div class="error-msg" id="loginError" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginErrorText"></span>
      </div>
    </div>
  </div>
</div>

<div id="ogrenciPanel" style="display:none;">
  <div class="header">
    <div class="header-left">
      <svg class="header-logo" viewBox="0 0 52 52" fill="none">
        <rect width="52" height="52" rx="13" fill="white" fill-opacity="0.1"/>
        <path d="M10 14C10 14 16 13 22 15.5V38C22 38 16 36 10 37V14Z" fill="white" fill-opacity="0.2"/>
        <path d="M42 14C42 14 36 13 30 15.5V38C30 38 36 36 42 37V14Z" fill="white" fill-opacity="0.2"/>
        <line x1="26" y1="15" x2="26" y2="38" stroke="white" stroke-opacity="0.6" stroke-width="1.5"/>
        <path d="M37 8V18L34.5 15.5L32 18V8H37Z" fill="#60a5fa"/>
      </svg>
      <h1 id="headerAd">Öğrenci Paneli</h1>
      <span class="header-badge" id="headerBadge"></span>
    </div>
    <button class="btn-cikis" id="cikisBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Çıkış
    </button>
  </div>
  <div class="panel">

    <div id="dersSec">
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span id="dersBaslik">Ders Seçin</span>
        </div>
        <div class="ders-grid" id="dersGrid"></div>
      </div>
    </div>

    <div id="testSec" style="display:none;">
      <button class="back-btn" id="dersGeriBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Derslere Dön
      </button>
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span id="testBaslik">Test Seçin</span>
        </div>
        <div class="test-list" id="testList"></div>
      </div>
    </div>

    <div id="cevapGiris" style="display:none;">
      <button class="back-btn" id="testGeriBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Testlere Dön
      </button>
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="cevapBaslik">Soruları Yanıtla</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progressYazi">0 / 0 soru cevaplandı</span>
            <strong id="progressYuzde">%0</strong>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
        </div>
        <div class="optik-wrap">
          <div class="optik-inner">
            <div class="optik-head">
              <span>No</span><span>A</span><span>B</span><span>C</span><span>D</span>
            </div>
            <div id="optikSorular"></div>
          </div>
        </div>
        <div class="gonder-wrap">
          <button class="btn-gonder" id="gonderBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Testi Gönder
          </button>
        </div>
      </div>
    </div>

    <div id="raporDiv" style="display:none;">
      <button class="back-btn" id="raporGeriBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Yeni Test Çöz
      </button>
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span id="raporBaslik">Test Sonuç Raporu</span>
        </div>
        <div class="rapor-ozet" id="raporOzet"></div>
        <div class="rapor-tablo-wrap">
          <table class="rapor-tablo">
            <thead><tr><th>No</th><th>Kazanım</th><th>Cevabın</th><th>Doğru</th><th>Sonuç</th></tr></thead>
            <tbody id="raporDetay"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFirestore, collection, getDocs, query, where, orderBy, addDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyAi0yhvBY9lz_-Lc3GXVSzcq4596d0zEao",
  authDomain: "odev-takip-sistemi-bf3fb.firebaseapp.com",
  projectId: "odev-takip-sistemi-bf3fb",
  storageBucket: "odev-takip-sistemi-bf3fb.firebasestorage.app",
  messagingSenderId: "1029015236060",
  appId: "1:1029015236060:web:7f54d0770aea5768bb7319"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// Firestore kuralları için anonim auth
signInAnonymously(auth).catch(e => console.log('Auth:', e));
let aktifOgrenci = null, aktifTest = null, sorular = [], cevaplar = {};

function showError(msg) {
  document.getElementById('loginError').style.display = 'flex';
  document.getElementById('loginErrorText').textContent = msg;
}

document.getElementById('girisBtn').addEventListener('click', async () => {
  const kullanici = document.getElementById('ogrKullanici').value.trim();
  const sifre = document.getElementById('ogrSifre').value.trim();
  if (!kullanici || !sifre) { showError('Tüm alanları doldurun!'); return; }
  document.getElementById('loginError').style.display = 'none';
  const q = query(collection(db, 'ogrenciler'), where('kullanici', '==', kullanici), where('sifre', '==', sifre));
  const snap = await getDocs(q);
  if (snap.empty) { showError('Kullanıcı adı veya şifre hatalı!'); return; }
  aktifOgrenci = { id: snap.docs[0].id, ...snap.docs[0].data() };
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('ogrenciPanel').style.display = 'block';
  document.getElementById('headerAd').textContent = `${aktifOgrenci.ad} ${aktifOgrenci.soyad}`;
  const badge = document.getElementById('headerBadge');
  badge.textContent = `${aktifOgrenci.sinif}/${aktifOgrenci.sube}`;
  badge.classList.add('show');
  dersleriYukle();
});

document.getElementById('cikisBtn').addEventListener('click', () => {
  aktifOgrenci = null;
  document.getElementById('loginSection').style.display = 'flex';
  document.getElementById('ogrenciPanel').style.display = 'none';
  document.getElementById('ogrKullanici').value = '';
  document.getElementById('ogrSifre').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('headerBadge').classList.remove('show');
});

const dersIkonlar = {
  'Türkçe': `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  'Matematik': `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  'Fen Bilimleri': `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>`,
};

async function dersleriYukle() {
  const q = query(collection(db, 'testler'), where('sinif', '==', aktifOgrenci.sinif));
  const snap = await getDocs(q);
  const dersler = [...new Set(snap.docs.map(d => d.data().ders))];
  const grid = document.getElementById('dersGrid');
  grid.innerHTML = '';
  dersler.forEach(ders => {
    const btn = document.createElement('button');
    btn.className = 'ders-btn';
    btn.innerHTML = (dersIkonlar[ders] || dersIkonlar['Türkçe']) + `<span>${ders}</span>`;
    btn.addEventListener('click', () => testleriYukle(ders));
    grid.appendChild(btn);
  });
  document.getElementById('dersBaslik').textContent = `${aktifOgrenci.sinif}. Sınıf — Ders Seçin`;
  goster('dersSec');
}

async function testleriYukle(ders) {
  const q = query(collection(db, 'testler'), where('sinif', '==', aktifOgrenci.sinif), where('ders', '==', ders));
  const snap = await getDocs(q);
  const list = document.getElementById('testList');
  list.innerHTML = '';
  snap.forEach(doc => {
    const t = doc.data();
    const item = document.createElement('div');
    item.className = 'test-item';
    item.innerHTML = `<div class="test-item-sol"><strong>${t.ad}</strong><span>${t.konu}</span></div><div class="test-item-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>`;
    item.addEventListener('click', () => testBaslat(doc.id, t));
    list.appendChild(item);
  });
  document.getElementById('testBaslik').textContent = `${ders} — Test Seçin`;
  goster('testSec');
}

async function testBaslat(testId, testData) {
  aktifTest = { id: testId, ...testData };
  cevaplar = {};
  const q = query(collection(db, 'sorular'), where('testId', '==', testId), orderBy('soruNo'));
  const snap = await getDocs(q);
  sorular = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const container = document.getElementById('optikSorular');
  container.innerHTML = '';
  sorular.forEach(s => {
    const row = document.createElement('div');
    row.className = 'optik-row';
    row.innerHTML = `<div class="optik-no">${s.soruNo}</div>`;
    ['A','B','C','D'].forEach(harf => {
      const cell = document.createElement('div');
      cell.className = 'optik-cell';
      const balon = document.createElement('div');
      balon.className = 'optik-balon';
      balon.textContent = harf;
      balon.dataset.soru = s.id;
      balon.dataset.harf = harf;
      balon.addEventListener('click', () => balonSec(s.id, harf));
      cell.appendChild(balon);
      row.appendChild(cell);
    });
    container.appendChild(row);
  });
  document.getElementById('cevapBaslik').textContent = `${aktifTest.ders} — ${aktifTest.ad}`;
  goster('cevapGiris');
  progressGuncelle();
}

function balonSec(soruId, harf) {
  document.querySelectorAll(`.optik-balon[data-soru="${soruId}"]`).forEach(b => b.className = 'optik-balon');
  document.querySelector(`.optik-balon[data-soru="${soruId}"][data-harf="${harf}"]`).classList.add(`secili-${harf}`);
  cevaplar[soruId] = harf;
  progressGuncelle();
}

function progressGuncelle() {
  const dolu = Object.keys(cevaplar).length, toplam = sorular.length;
  const yuzde = toplam > 0 ? Math.round((dolu/toplam)*100) : 0;
  document.getElementById('progressBar').style.width = yuzde + '%';
  document.getElementById('progressYazi').textContent = `${dolu} / ${toplam} soru cevaplandı`;
  document.getElementById('progressYuzde').textContent = `%${yuzde}`;
  const btn = document.getElementById('gonderBtn');
  btn.disabled = dolu !== toplam || toplam === 0;
}

document.getElementById('gonderBtn').addEventListener('click', async () => {
  let dogru = 0, yanlis = 0;
  const detaylar = [];
  sorular.forEach(s => {
    const ogrCevap = cevaplar[s.id], dogruMu = ogrCevap === s.cevap;
    if (dogruMu) dogru++; else yanlis++;
    detaylar.push({ soruNo: s.soruNo, kazanim: s.kazanim, ogrCevap, dogruCevap: s.cevap, dogruMu });
  });
  const simdi = new Date();
  await addDoc(collection(db, 'sonuclar'), {
    ogrenciId: aktifOgrenci.id, ogrenciAd: `${aktifOgrenci.ad} ${aktifOgrenci.soyad}`,
    sinif: aktifOgrenci.sinif, sube: aktifOgrenci.sube,
    testId: aktifTest.id, testAd: aktifTest.ad, ders: aktifTest.ders, konu: aktifTest.konu,
    dogru, yanlis, toplam: sorular.length, detaylar, tarih: simdi
  });
  raporGoster(dogru, yanlis, detaylar, simdi);
});

function raporGoster(dogru, yanlis, detaylar, tarih) {
  const toplam = sorular.length;
  const net = (dogru - yanlis * 0.25).toFixed(2);
  const yuzde = Math.round((dogru/toplam)*100);
  document.getElementById('raporOzet').innerHTML = `
    <div class="ozet-kart dogru"><div class="ozet-sayi">${dogru}</div><div class="ozet-label">Doğru</div></div>
    <div class="ozet-kart yanlis"><div class="ozet-sayi">${yanlis}</div><div class="ozet-label">Yanlış</div></div>
    <div class="ozet-kart net"><div class="ozet-sayi">${net}</div><div class="ozet-label">Net</div></div>
    <div class="ozet-kart basari"><div class="ozet-sayi">%${yuzde}</div><div class="ozet-label">Başarı</div></div>`;
  const tbody = document.getElementById('raporDetay');
  tbody.innerHTML = '';
  detaylar.forEach(d => {
    tbody.innerHTML += `<tr class="${d.dogruMu?'dogru-satir':'yanlis-satir'}">
      <td>${d.soruNo}</td><td>${d.kazanim}</td>
      <td><strong>${d.ogrCevap}</strong></td><td><strong>${d.dogruCevap}</strong></td>
      <td><span class="${d.dogruMu?'dogru-tag':'yanlis-tag'}">${d.dogruMu?'✓ Doğru':'✗ Yanlış'}</span></td></tr>`;
  });
  const saatStr = tarih.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('raporBaslik').textContent = `${aktifTest.ders} — ${aktifTest.ad} | ${tarih.toLocaleDateString('tr-TR')} ${saatStr}`;
  goster('raporDiv');
}

document.getElementById('dersGeriBtn').addEventListener('click', () => goster('dersSec'));
document.getElementById('testGeriBtn').addEventListener('click', () => dersleriYukle());
document.getElementById('raporGeriBtn').addEventListener('click', () => dersleriYukle());

function goster(id) {
  ['dersSec','testSec','cevapGiris','raporDiv'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
